name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: release-it (tag only)
        run: |
          npm install --no-save --no-package-lock release-it@17 @release-it/conventional-changelog@9
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx release-it --ci
      - name: Detect tag on HEAD
        id: tag
        run: |
          t=$(git tag --points-at HEAD | grep '^v' | head -1 || true)
          echo "version=${t#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.tag.outputs.version }}
