name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Next semver from conventional commits (feat: minor, fix: patch, BREAKING CHANGE/!: major; other commits: patch)
      - name: Compute version
        id: ver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true
      - name: Set version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ steps.ver.outputs.new_version }}' } else { '0.0.0-dev' }
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Publish
        run: dotnet publish src/ObsQr/ObsQr.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o publish
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" installer\ObsQr.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
      - name: Release
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          files: dist/ObsQr-Setup-${{ env.VERSION }}.exe
          generate_release_notes: true
