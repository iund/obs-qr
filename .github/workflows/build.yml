name: Build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/ObsQr/ObsQr.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o publish
      - name: MSI (WiX)
        run: |
          dotnet tool install --global wix --version 4.0.5
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build installer/ObsQr.wxs -arch x64 -d Version=${{ env.VERSION }} -d Source=publish\ObsQr.exe -o dist/ObsQr-${{ env.VERSION }}.msi
      - name: EXE (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=${{ env.VERSION }}" installer\ObsQr.iss
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/ObsQr-${{ env.VERSION }}.msi
            dist/ObsQr-Setup-${{ env.VERSION }}.exe
